<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro MD Walkman Player</title><style>
:root{--metal:#929bb4;--light:#d8ddeb;--dark:#59647e;--edge:#424b60;--lcd:#9cae9c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#f7f8fa,#c9ced8 75%,#adb4c0);color:#222b38;font-family:Arial,'Noto Sans JP',sans-serif;min-height:100vh}.wrap{max-width:800px;margin:auto;padding:20px 15px 55px}h1{font-size:19px;letter-spacing:3px;text-align:center;margin:3px 0 5px}.sub{text-align:center;font-size:11px;color:#626d7a;margin-bottom:24px}.scene{position:relative;padding:0 0 25px}.remote{width:min(94%,460px);height:70px;margin:0 auto 28px;border-radius:26px 22px 22px 26px;background:linear-gradient(175deg,#f5f7f8 0%,#9ca4ad 23%,#d6dbe1 44%,#858d9a 79%,#444e5d);border:2px solid #7b8591;box-shadow:0 9px 12px #4e56604a,inset 0 3px 3px #fff9;display:flex;align-items:center;padding:8px 11px;gap:8px;position:relative;z-index:2}.remote:before{content:'';position:absolute;left:-22px;width:25px;height:7px;background:#242a30;border-radius:5px}.screen{height:48px;flex:1;min-width:0;border-radius:15px;background:linear-gradient(120deg,#121b1b,#283733 50%,#0c1718);border:3px solid #39464b;box-shadow:inset 0 2px 8px #000a;color:#c8e4c9;padding:4px 10px;overflow:hidden}.screen .status{font-size:10px;display:flex;justify-content:space-between;letter-spacing:1px;opacity:.85}.screen .title{font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;margin-top:3px}.remote-controls{display:flex;gap:3px;align-items:center}.remote button{width:27px;height:31px;border:1px solid #66707c;border-radius:7px;background:linear-gradient(#e9edf0,#8f99a5);box-shadow:inset 0 1px 1px white;color:#25303a;font-size:13px;cursor:pointer}.remote button:active{transform:translateY(1px)}.player{width:min(100%,550px);aspect-ratio:1.37;margin:0 auto;position:relative;border-radius:24px 30px 24px 22px;background:linear-gradient(130deg,var(--light) 0%,var(--metal) 16%,var(--metal) 60%,var(--dark) 100%);border:4px solid var(--edge);box-shadow:0 16px 24px #3b45565e,inset 3px 4px 5px #fff8,inset -6px -7px 8px #31374755;overflow:hidden;transition:background .2s}.lid{position:absolute;inset:3% 18% 4% 3%;border-radius:18px 6px 12px 14px;border:2px solid #ffffff4d;border-right:3px solid #333c5270;box-shadow:inset 0 0 10px #ffffff3b}.circle{position:absolute;width:78%;aspect-ratio:1;top:0%;left:8%;border-radius:50%;border:3px solid #ffffff45;box-shadow:inset 0 0 0 2px #59637b25,0 1px 3px #47536b45;opacity:.7}.brand{position:absolute;top:12%;left:31%;font-size:clamp(19px,5vw,34px);font-weight:900;letter-spacing:4px;color:#eef0f5;text-shadow:1px 2px 2px #4b5670}.mdlabel{position:absolute;top:47%;left:42%;font-size:clamp(26px,7vw,55px);font-style:italic;font-weight:900;letter-spacing:-3px;color:#323b50;line-height:.7}.mdlabel small{display:block;font-size:clamp(9px,2vw,16px);letter-spacing:0;font-style:normal;margin-top:13px}.slot{position:absolute;top:50%;left:13%;width:29%;height:9%;background:#161c26;border-radius:20px;box-shadow:inset 0 2px 5px black,0 1px 2px #ffffff80}.hinge{position:absolute;right:0;top:0;height:100%;width:17%;border-left:4px solid #4a5469;background:linear-gradient(90deg,#7c859d,var(--light) 35%,var(--metal) 70%,#69748b);box-shadow:inset 4px 0 4px #fff6}.hinge:after{content:'MD\a LP';white-space:pre;position:absolute;bottom:10%;left:25%;font-size:clamp(10px,2vw,17px);font-weight:900;line-height:.9;border:2px solid #596278;padding:3px}.eject{position:absolute;bottom:9%;left:33%;border:1px solid #58647a;border-radius:4px;background:#d8deea;color:#384255;font-size:10px;padding:5px 12px;cursor:pointer}.eject:active{transform:translateY(2px)}.note{text-align:center;font-size:12px;color:#5e6977;margin:10px auto 16px}.panel{background:#ffffffb8;border:1px solid #fff;border-radius:16px;padding:17px;box-shadow:0 8px 20px #53607520}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:9px 0}.row label{font-size:13px;font-weight:bold}.upload{display:inline-block;background:#283b55;color:white;border-radius:10px;padding:11px 15px;cursor:pointer;font-size:14px}.upload input{display:none}.pill{border:1px solid #a4acb7;background:white;border-radius:9px;padding:9px 12px;cursor:pointer}.colors{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #808b9b;cursor:pointer}.swatch[aria-pressed=true]{outline:3px solid #283b55;outline-offset:2px}.progress{display:flex;align-items:center;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}.progress input{flex:1;min-width:0}input[type=range]{accent-color:#3c5875}.tracklist{list-style:none;margin:10px 0 0;padding:0;max-height:240px;overflow:auto}.tracklist li{padding:10px;border-bottom:1px solid #c8ced7;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px}.tracklist li.active{background:#dce7f2;border-radius:6px;font-weight:bold}.tracklist li span{flex:1;overflow-wrap:anywhere}.empty{color:#6b7580;font-size:13px}.switch[aria-pressed=true]{background:#304b6c;color:white}footer{text-align:center;font-size:11px;color:#66717e;margin-top:15px}@media(max-width:480px){.remote{height:66px;padding:7px;gap:4px}.screen{padding:4px 6px}.remote button{width:25px}.player{border-width:3px}.wrap{padding:15px 10px 35px}.panel{padding:12px}}
</style></head><body><main class="wrap"><h1>MINIDISC PLAYER</h1><div class="sub">RETRO PORTABLE AUDIO · CUSTOM COLOR EDITION</div><div class="scene"><div class="remote" aria-label="液晶リモコン"><div class="screen"><div class="status"><span id="state">■ STOP</span><span id="tracknum">TRACK --</span><span id="battery">▰▰▰</span></div><div class="title" id="lcd">NO DISC · 曲を読み込んでください</div></div><div class="remote-controls"><button id="prev" title="前の曲">◀◀</button><button id="play" title="再生・一時停止">▶</button><button id="next" title="次の曲">▶▶</button></div></div><div class="player"><div class="lid"><div class="circle"></div><div class="brand">MD</div><div class="slot"></div><div class="mdlabel">MD<small>WALKMAN STYLE</small></div></div><div class="hinge"></div><button class="eject" id="eject">OPEN / EJECT</button></div></div><div class="note">上部の液晶リモコンで操作できます。OPENで音楽を追加できます。</div><section class="panel"><div class="row"><label class="upload">＋ 音楽ファイルを選ぶ<input id="files" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac" multiple></label><button class="pill" id="clear">曲を取り出す</button></div><div class="row"><label>本体カラー</label><div class="colors" id="colors"></div></div><div class="row progress"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置"><span id="duration">0:00</span></div><div class="row"><button class="pill switch" id="shuffle" aria-pressed="false">🔀 シャッフル OFF</button><button class="pill switch" id="repeat" aria-pressed="false">🔁 リピート OFF</button><label for="volume">音量</label><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></div><div style="font-size:13px;font-weight:bold;margin-top:15px">DISC TRACKS <span id="count">(0曲)</span></div><ol class="tracklist" id="list"><li class="empty">音楽ファイルを選ぶと、ここに曲が表示されます。</li></ol></section><footer>個人制作のレトロ風プレイヤーです。SONY公式製品ではありません。<br>音楽は端末内で再生され、サーバーへアップロードされません。</footer></main><audio id="audio" preload="metadata"></audio><script>
const $=id=>document.getElementById(id),audio=$('audio');let tracks=[],idx=-1,shuffle=false,repeat=false;const palette=[['シルバー','#a1a9b6','#e4e7ed','#646d7c','#4b5464'],['ブルー','#688fbf','#c6ddf6','#33567f','#244365'],['ブラック','#464b55','#a5acb7','#242a33','#171d27'],['ピンク','#ce8eae','#f5d7e6','#9b547c','#793a5e'],['ゴールド','#c3ad7b','#f1e2bb','#877449','#695937'],['パープル','#9887bb','#e2d7f4','#62527f','#4c3d69']];function color(n){const p=palette[n];['--metal','--light','--dark','--edge'].forEach((k,i)=>document.documentElement.style.setProperty(k,p[i+1]));localStorage.setItem('mdcolor',n);document.querySelectorAll('.swatch').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n)))}palette.forEach((p,i)=>{let b=document.createElement('button');b.className='swatch';b.title=p[0];b.setAttribute('aria-label',p[0]);b.style.background=p[1];b.onclick=()=>color(i);$('colors').append(b)});color(Math.max(0,Math.min(palette.length-1,Number(localStorage.getItem('mdcolor'))||0)));function time(s){if(!Number.isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}function refresh(){let t=tracks[idx];$('lcd').textContent=t?t.name:'NO DISC · 曲を読み込んでください';$('tracknum').textContent=t?'TRACK '+String(idx+1).padStart(2,'0'):'TRACK --';$('state').textContent=audio.paused?'■ STOP':'▶ PLAY';$('play').textContent=audio.paused?'▶':'Ⅱ';$('count').textContent='('+tracks.length+'曲)';$('list').replaceChildren();if(!tracks.length){let li=document.createElement('li');li.className='empty';li.textContent='音楽ファイルを選ぶと、ここに曲が表示されます。';$('list').append(li)}tracks.forEach((t,i)=>{let li=document.createElement('li');li.className=i===idx?'active':'';let n=document.createElement('b');n.textContent=String(i+1).padStart(2,'0');let name=document.createElement('span');name.textContent=t.name;li.append(n,name);li.onclick=()=>load(i,true);$('list').append(li)})}function load(i,autoplay){if(i<0||i>=tracks.length)return;idx=i;audio.src=tracks[i].url;audio.load();refresh();if(autoplay)audio.play().catch(()=>{});}function next(dir=1){if(!tracks.length)return;let n=shuffle&&tracks.length>1?(idx+1+Math.floor(Math.random()*(tracks.length-1)))%tracks.length:(idx+dir+tracks.length)%tracks.length;load(n,true)}$('files').addEventListener('change',e=>{const fs=[...e.target.files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|flac)$/i.test(f.name));if(!fs.length)return;const wasEmpty=!tracks.length;fs.forEach(f=>tracks.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));if(wasEmpty)load(0,false);refresh();e.target.value=''});$('eject').onclick=()=>$('files').click();$('play').onclick=()=>{if(!tracks.length){$('files').click();return}if(idx<0)load(0,false);if(audio.paused)audio.play().catch(()=>{});else audio.pause()};$('prev').onclick=()=>{if(audio.currentTime>3){audio.currentTime=0;return}next(-1)};$('next').onclick=()=>next(1);$('clear').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();tracks.forEach(t=>URL.revokeObjectURL(t.url));tracks=[];idx=-1;$('seek').value=0;$('elapsed').textContent='0:00';$('duration').textContent='0:00';refresh()};$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').setAttribute('aria-pressed',String(shuffle));$('shuffle').textContent='🔀 シャッフル '+(shuffle?'ON':'OFF')};$('repeat').onclick=()=>{repeat=!repeat;$('repeat').setAttribute('aria-pressed',String(repeat));$('repeat').textContent='🔁 リピート '+(repeat?'ON':'OFF')};$('volume').oninput=e=>audio.volume=Number(e.target.value);audio.volume=.8;audio.ontimeupdate=()=>{$('elapsed').textContent=time(audio.currentTime);$('duration').textContent=time(audio.duration);$('seek').value=audio.duration?Math.round(audio.currentTime/audio.duration*1000):0};$('seek').oninput=e=>{if(audio.duration)audio.currentTime=Number(e.target.value)/1000*audio.duration};audio.onplay=refresh;audio.onpause=refresh;audio.onended=()=>{if(repeat){audio.currentTime=0;audio.play().catch(()=>{})}else if(idx<tracks.length-1||shuffle)next(1);else refresh()};refresh();
</script></body></html>
