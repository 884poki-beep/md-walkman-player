<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro MD Player</title><style>
:root{--shell:#bfc8d2;--shell2:#e6ebf0;--ink:#273344;--lcd:#a9c7ad;--accent:#55758f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#33425b,#111721 70%);color:#f3f5fa;font-family:system-ui,'Noto Sans JP',sans-serif;display:flex;justify-content:center;padding:28px 12px}.wrap{width:min(100%,480px)}h1{text-align:center;font-size:1.35rem;letter-spacing:.14em;margin:0 0 7px}.sub{text-align:center;color:#bdc7d5;font-size:.8rem;margin:0 0 20px}.player{background:linear-gradient(140deg,var(--shell2),var(--shell) 45%,#8995a4);border-radius:32px;padding:23px;box-shadow:inset 2px 3px 4px #ffffff99,inset -3px -5px 9px #0005,0 22px 40px #0009;border:2px solid #ffffff4d;color:var(--ink);transition:background .25s}.brand{display:flex;justify-content:space-between;font-size:.75rem;font-weight:900;letter-spacing:.12em;margin-bottom:15px}.lcd{background:linear-gradient(135deg,#d3e1d1,var(--lcd));border:9px solid #66717d;border-radius:12px;min-height:147px;padding:13px;box-shadow:inset 0 3px 8px #0005,0 2px 3px #fff9;font-family:ui-monospace,monospace}.lcd .top{display:flex;justify-content:space-between;font-size:.7rem;font-weight:800}.song{font-size:1.14rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:15px}.artist{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{display:flex;justify-content:space-between;margin-top:10px;font-weight:900}.discarea{height:190px;display:flex;justify-content:center;align-items:center;position:relative}.disc{height:157px;width:157px;border-radius:50%;background:repeating-radial-gradient(circle,#8c98a7 0px,#e2e7ee 3px,#b5c0ce 5px,#e5eaf1 7px);border:5px solid #dbe2ec;box-shadow:0 4px 12px #0006;display:grid;place-items:center}.disc.playing{animation:spin 3s linear infinite}.disc .label{width:103px;height:103px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:white;text-align:center;font-size:.74rem;font-weight:bold;overflow:hidden;padding:8px;position:relative}.disc .label:after{content:'';position:absolute;inset:42px;border-radius:50%;background:#e7ebf2;border:4px solid #7a8492}@keyframes spin{to{transform:rotate(360deg)}}.controls{display:flex;gap:10px;justify-content:center;margin-bottom:12px}button{cursor:pointer;border:0;font:inherit}.controls button{width:56px;height:52px;border-radius:14px;background:linear-gradient(#f4f6f9,#a9b4c2);box-shadow:0 4px 0 #647080,0 6px 8px #0004;color:#263244;font-size:1.3rem;font-weight:bold}.controls button:active{transform:translateY(3px);box-shadow:0 1px 0 #647080}.controls .primary{background:linear-gradient(#f7ffff,#a6c7df);width:72px}.progress{width:100%;accent-color:#2f5772;margin:8px 0}.options{display:flex;justify-content:center;gap:10px;margin-top:12px}.options button{border-radius:12px;background:#29384a;color:white;padding:9px 13px;font-size:.8rem}.options button.active{background:#bde2fc;color:#182638}.below{background:#ffffff12;border:1px solid #ffffff33;border-radius:18px;margin-top:17px;padding:15px}.below h2{font-size:.95rem;margin:0 0 12px}.colors{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.swatch{width:38px;height:38px;border-radius:50%;border:3px solid #ffffff99;box-shadow:0 2px 5px #0007}.swatch[aria-pressed=true]{outline:3px solid white;outline-offset:3px}.upload{display:block;text-align:center;border:2px dashed #99b6d3;border-radius:12px;padding:15px;cursor:pointer;color:#e6f3ff}.upload input{display:none}.hint{font-size:.75rem;color:#b9c8d9;line-height:1.6;margin:10px 0 0}.list{list-style:none;padding:0;margin:10px 0 0;max-height:240px;overflow:auto}.list li{display:flex;gap:8px;align-items:center;border-bottom:1px solid #ffffff22}.list button{background:transparent;color:white;text-align:left;padding:12px 5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list li.selected button{color:#b9e4ff;font-weight:bold}.empty{font-size:.85rem;color:#bdc7d5}footer{text-align:center;color:#9caabc;font-size:.72rem;margin-top:18px}</style></head><body><main class="wrap"><h1>RETRO MD PLAYER</h1><p class="sub">COLOR EDITION · DIGITAL MINI DISC</p><section class="player"><div class="brand"><span>♪ dongurikobo</span><span>MD DIGITAL AUDIO</span></div><div class="lcd" aria-live="polite"><div class="top"><span id="mode">STOP ◼</span><span>🔋 ▰▰▰</span></div><div class="song" id="title">NO DISC</div><div class="artist" id="artist">音楽ファイルを追加してください</div><div class="time"><span id="elapsed">00:00</span><span id="duration">00:00</span></div></div><div class="discarea"><div class="disc" id="disc"><div class="label">MINI<br>DISC</div></div></div><input class="progress" type="range" id="seek" min="0" max="100" value="0" aria-label="再生位置"><div class="controls"><button id="prev" aria-label="前の曲">⏮</button><button id="play" class="primary" aria-label="再生">▶</button><button id="stop" aria-label="停止">■</button><button id="next" aria-label="次の曲">⏭</button></div><div class="options"><button id="shuffle" aria-pressed="false">🔀 シャッフル</button><button id="repeat" aria-label="リピート設定">🔁 OFF</button></div></section><section class="below"><h2>🎨 本体カラー</h2><div class="colors" id="colors"></div></section><section class="below"><h2>💿 MDに音楽を入れる</h2><label class="upload">＋ MP3・音楽ファイルを選ぶ<input id="files" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac" multiple></label><p class="hint">選択した音楽はこの端末内で再生され、サーバーには送信されません。ブラウザを閉じると曲の再選択が必要です。</p><ul class="list" id="tracks"><li class="empty">まだ曲がありません</li></ul></section><footer>Made for music lovers · Retro MD Player</footer><audio id="audio" preload="metadata"></audio></main><script>
const themes=[['シルバー','#bdc7d1','#e6ebf0','#a9c7ad','#55758f'],['ブルー','#5585bf','#b4d5f5','#b1d6d7','#225b9b'],['ブラック','#303844','#7b8490','#a9c4ad','#333e55'],['ピンク','#e5a3c0','#ffe1ef','#d2d3b5','#a95482'],['ゴールド','#c7ac68','#f8e8b6','#d1d6ad','#aa8033'],['パープル','#937ab9','#e3d5fa','#c1b7d7','#6943a0']];const root=document.documentElement;const colorBox=document.getElementById('colors');let selectedTheme=localStorage.getItem('md-theme')||'0';themes.forEach((t,i)=>{let b=document.createElement('button');b.className='swatch';b.style.background=t[1];b.title=t[0];b.setAttribute('aria-label',t[0]);b.onclick=()=>setTheme(i);colorBox.append(b)});function setTheme(i){selectedTheme=String(i);localStorage.setItem('md-theme',selectedTheme);const t=themes[i];['--shell','--shell2','--lcd','--accent'].forEach((k,j)=>root.style.setProperty(k,t[j+1]));[...colorBox.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i?'true':'false'))}setTheme(Number(selectedTheme)<themes.length?Number(selectedTheme):0);
const audio=document.getElementById('audio'),files=document.getElementById('files'),tracks=document.getElementById('tracks'),play=document.getElementById('play'),disc=document.getElementById('disc'),seek=document.getElementById('seek');let songs=[],current=-1,shuffle=false,repeat=0;function fmt(t){if(!Number.isFinite(t))return '00:00';return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`}function update(){document.getElementById('mode').textContent=audio.paused?'STOP ◼':'PLAY ▶';play.textContent=audio.paused?'▶':'❚❚';disc.classList.toggle('playing',!audio.paused);document.getElementById('elapsed').textContent=fmt(audio.currentTime);document.getElementById('duration').textContent=fmt(audio.duration);seek.value=audio.duration?audio.currentTime/audio.duration*100:0}function render(){tracks.innerHTML='';songs.forEach((s,i)=>{const li=document.createElement('li');li.className=i===current?'selected':'';const b=document.createElement('button');b.textContent=`${String(i+1).padStart(2,'0')}  ${s.name}`;b.onclick=()=>load(i,true);li.append(b);tracks.append(li)});if(!songs.length)tracks.innerHTML='<li class="empty">まだ曲がありません</li>'}async function load(i,autoplay=false){if(i<0||i>=songs.length)return;current=i;audio.src=songs[i].url;document.getElementById('title').textContent=songs[i].name;document.getElementById('artist').textContent=`TRACK ${i+1} / ${songs.length}`;render();audio.load();if(autoplay){try{await audio.play()}catch(e){console.warn('再生できません',e)}}update()}files.onchange=e=>{const incoming=[...e.target.files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|flac)$/i.test(f.name));for(const f of incoming)songs.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)});render();if(current===-1&&songs.length)load(0,false);files.value=''};play.onclick=async()=>{if(current===-1)return;if(audio.paused){try{await audio.play()}catch(e){alert('このファイルは再生できません')}}else audio.pause();update()};document.getElementById('stop').onclick=()=>{audio.pause();audio.currentTime=0;update()};function advance(step){if(!songs.length)return;let next=shuffle&&songs.length>1?Math.floor(Math.random()*(songs.length-1)):null;if(next!==null){if(next>=current)next++}else next=(current+step+songs.length)%songs.length;load(next,true)}document.getElementById('next').onclick=()=>advance(1);document.getElementById('prev').onclick=()=>{if(audio.currentTime>3){audio.currentTime=0}else advance(-1)};seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration};audio.ontimeupdate=update;audio.onplay=update;audio.onpause=update;audio.onloadedmetadata=update;audio.onended=()=>{if(repeat===2){audio.currentTime=0;audio.play()}else if(repeat===1||current<songs.length-1)advance(1);else update()};document.getElementById('shuffle').onclick=e=>{shuffle=!shuffle;e.target.classList.toggle('active',shuffle);e.target.setAttribute('aria-pressed',String(shuffle))};document.getElementById('repeat').onclick=e=>{repeat=(repeat+1)%3;e.target.textContent=['🔁 OFF','🔁 ALL','🔂 ONE'][repeat];e.target.classList.toggle('active',repeat!==0)};window.addEventListener('pagehide',()=>songs.forEach(s=>URL.revokeObjectURL(s.url)));
</script></body></html>
